<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Cartão Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

  <header>
    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <div class="avatar-ring"></div>
      <!-- Substitua pelo link da sua foto do GitHub -->
      <img src="https://avatars.githubusercontent.com/u/178489209?v=4" alt="Foto de Perfil" class="profile-img">
    </div>

    <h1>Daniel <em>Flores</em></h1>
    <p class="subtitle">Estudante de Tecnologia</p>
    <div class="divider"></div>
  </header>

  <main class="links">

    <a href="https://github.com/Kutsky" class="link-card" onclick="mostrarMensagem('GitHub')">
      <div class="link-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/>
        </svg>
      </div>
      <span class="link-label">
        <span class="link-name">Meu GitHub</span>
        <span class="link-sub">Repositórios e projetos</span>
      </span>
      <span class="link-arrow">→</span>
    </a>

    <a href="https://instagram.com/ynsumnia" class="link-card" onclick="mostrarMensagem('Instagram')">
      <div class="link-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"/>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
        </svg>
      </div>
      <span class="link-label">
        <span class="link-name">Instagram</span>
        <span class="link-sub">Acompanhe minha jornada</span>
      </span>
      <span class="link-arrow">→</span>
    </a>

    <a href="mailto:yuribernardinodarosa@gmail.com" class="link-card">
      <div class="link-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>
      <span class="link-label">
        <span class="link-name">E-mail de Contato</span>
        <span class="link-sub">daniel.apolinario.criciuma@gmail.com</span>
      </span>
      <span class="link-arrow">→</span>
    </a>

  </main>

  <footer>
    Desenvolvido durante a aula do <span>Prof. Jucemar</span>
  </footer>

</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>

</body>
</html>
